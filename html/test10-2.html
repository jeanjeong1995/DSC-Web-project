<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앵커 태그 2단계-다양한 링크</title>
<style>
    html{
        scroll-behavior: smooth;
    }
</style>


</head>

<body id="top">
    <h1>앵커 태그 2단계: 다양한 링크 만들기</h1>
    
    <!--①. 새창 링크 + 보안 속성 rel~-->
    <!--"target="_blank" rel="noopener noreferrer"-->
    <h2>①새창 / 현재 창 링크</h2>>
    <p>
        <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">구글(새창)</a>
        <a href="https://www.google.com" target="_self">구글(현재창)</a>
    </p>
    <!--②. 메일 보내기: 제목(subject)과 본문(body)까찌 미리 채우기-->
    <!--띄어쓰기는 %20, 여러 값은 &로 연결-->
    <h2>② 메일 보내기: 제목(subject)과 본문(body)까지 미리 채우기</h2>
    <p>
        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=jeanjeong1995@gmail.com&subject=수강%20문의&body=안녕하세요,%20 수강문의 드립니다." target="_blank" title="장수사과 담당자 연결">사과 주문 메일 보내기</a>
    </p>

    <!--③. 전화 걸기: 스마트폰에서 누르면 전화 앱이 열림-->
    <h2>③ 전화 걸기</h2>
    <p>
        <a href="tel:010-5774-0832" title="장수사과 담당자 연결">담당 ☎010-5774-0832</a>
    </p>

    <!--④. 같은 폴더의 다른 html파일로 이동(상대경로)-->
    <h2>④ 내 사이트의 다른 페이지로 이동</h2>
    <p>
        <a href="/html/test09-3.html" title="🗞9-3뉴스페이지로 이동 "target="_blank" rel="noopener noreferrer">9단계 뉴스컬럼 페이지 이동</a>
    </p>

    <!--⑤. 이미지 링크 걸기: a태그 안에 img 걸기-->
    <h2>⑤ 이미지 링크</h2>
    <p>
        <a href="https://www.naver.com" target="_blank" rel="noopener noreferrer" title="네이버로 이동하기"alt="네이버이동">
            <img src="https://placehold.co/300x100?text=NAVER" alt="네이버 로고">
        </a>
        <a href="https://www.naver.com" target="_blank" rel="noopener noreferrer" title="네이버로 이동하기"alt="네이버이동">
            <img src="/img/naver-logo.png" alt="네이버 로고">
        </a>
      
    </p>

    <!--⑥. 파일 다운로드:down속성 (같은 사이트)-->
    <h2>⑥ 파일 다운로드</h2>
    <p>
        <a href="/img/naver-logo.png" download="실습이미지.png">실습 이미지 다운로드 받기</a>
        <a href="/html/test01.html" download="코칭 주문서">실습 html 파일 다운로드 받기</a>
    </p>

    <!-- 스크롤 공간 확보-->
    <div style="height: 800px;">↓ 아래로 스크롤 하세요. </div>

    <!--⑦. 맨 위로 이동: body 테그에 id값 id="top" 적용 후 이동-->
    <p>
        <a href="#top">↑맨 위로</a>

    </p>

</body>

</html>
